services:
  # Backend API
  - type: web
    name: quakesight-backend
    env: python
    region: oregon
    buildCommand: pip install --only-binary=:all: -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: https://quake-sight-beryl.vercel.app,http://localhost:3000
